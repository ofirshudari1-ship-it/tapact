<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
<title>TapAct</title>
<link rel="stylesheet" href="clipboard-history.css">
<script src="../lib/window-boot.js"></script>
<script src="../lib/i18n-renderer.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <span class="title">📋 <span data-i18n="clip.title">היסטוריית לוח</span></span>
      <button id="selectModeBtn" class="icon-btn" data-i18n-title="clip.panel.selectMode" title="Select">☑</button>
      <button id="closeBtn" class="icon-btn" data-i18n-title="popup.close" title="Close">✕</button>
    </header>

    <div class="toolbar">
      <input id="searchInput" type="text" data-i18n-placeholder="clip.panel.search" placeholder="Search history, including tags...">
    </div>

    <div class="filters" id="filters">
      <button class="chip active" data-cat="all" data-i18n="clip.filter.all">הכל</button>
      <button class="chip" data-cat="pinned" data-i18n="clip.filter.pinned">📌 מוצמד</button>
      <button class="chip" data-cat="phone" data-i18n="clip.filter.phone">📞 טלפון</button>
      <button class="chip" data-cat="tracking" data-i18n="clip.filter.tracking">📦 מעקב</button>
      <button class="chip" data-cat="address" data-i18n="clip.filter.address">🗺️ כתובת</button>
      <button class="chip" data-cat="url" data-i18n="clip.filter.link">🔗 קישור</button>
      <button class="chip" data-cat="email" data-i18n="clip.filter.email">✉️ מייל</button>
      <button class="chip" data-cat="custom" data-i18n="clip.filter.custom">⚡ מותאם</button>
      <button class="chip" data-cat="text" data-i18n="clip.filter.text">📋 טקסט</button>
    </div>

    <div class="count-row" id="countLabel"></div>

    <div class="list" id="list"></div>
    <div class="empty hidden" id="emptyState">
      <span class="empty-icon">📋</span>
      <span id="emptyStateText" data-i18n="clip.panel.empty">אין עדיין העתקות בהיסטוריה</span>
    </div>

    <div class="select-bar hidden" id="selectBar">
      <span id="selectCountLabel"></span>
      <span class="select-bar-actions">
        <button id="copySelectedBtn" data-i18n="clip.panel.copySelected">העתק את הנבחרים</button>
        <button id="cancelSelectBtn" data-i18n="clip.panel.selectModeExit">ביטול</button>
      </span>
    </div>

    <footer class="footer">
      <span class="status">
        <span id="pauseDot" class="pause-dot"></span>
        <span id="statusText" data-i18n="clip.panel.recording">מקליט</span>
        <button id="toggleBtn" data-i18n="clip.pause">השהה</button>
      </span>
      <span class="footer-actions">
        <button id="exportBtn" data-i18n="clip.panel.export">ייצוא</button>
        <button id="importBtn" data-i18n="clip.panel.import">ייבוא</button>
        <button id="clearBtn" data-i18n="clip.panel.clearAll">נקה הכל</button>
      </span>
    </footer>
  </main>

  <script src="clipboard-history.js"></script>
</body>
</html>
