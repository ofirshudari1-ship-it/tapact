<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
<title>TapAct</title>
<link rel="stylesheet" href="action-popup.css">
<script src="../lib/window-boot.js"></script>
<script src="../lib/i18n-renderer.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="title" id="titleLabel" data-i18n="popup.title">📎 TapAct</span>
      <button id="settingsBtn" class="icon-btn" data-i18n-title="popup.settings" title="Settings">⚙</button>
      <button id="closeBtn" class="icon-btn" data-i18n-title="popup.close" title="Close">✕</button>
    </header>

    <div class="body">
      <section class="detect-row">
        <span class="badge">✓</span>
        <div class="detect-text">
          <span class="detect-label" id="detectLabel" data-i18n="action.detected">Detected</span>
          <span class="detect-value" id="detectValue"></span>
        </div>
      </section>

      <div class="actions" id="actionsList"></div>
    </div>
  </div>

  <script src="action-popup.js"></script>
</body>
</html>
