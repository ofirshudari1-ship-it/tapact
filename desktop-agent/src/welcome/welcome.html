<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
<title>TapAct</title>
<link rel="stylesheet" href="welcome.css">
<!-- Runs before the body is parsed: sets lang/dir/theme from the query string
     main.js passes (see welcomeLoadOptions), so the very first paint is
     already in the right direction and theme. Inline scripts are blocked by
     this page's CSP, which is why this is a file. -->
<script src="welcome-boot.js"></script>
<script src="../lib/i18n-renderer.js"></script>
<script src="../lib/accelerator-format.js"></script>
</head>
<body>
  <div class="app">

    <header class="welcome-header">
      <img class="brand-logo" src="../../assets/logo.png" alt="">
      <div>
        <div class="brand-name" translate="no">TapAct</div>
        <div class="brand-sub" data-i18n="header.subtitle"></div>
      </div>
      <div class="header-tools">
        <button type="button" id="langToggleBtn" class="hdr-pill" title="Change language / שנה שפה" aria-label="Change language / שנה שפה">🌐</button>
        <button type="button" id="themeToggleBtn" class="hdr-pill" data-i18n-title="welcome.theme.title" data-i18n-aria="welcome.theme.title">🌙</button>
      </div>
    </header>

    <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

    <main class="steps" id="steps" aria-live="polite">

      <section class="step active" data-step="0" aria-labelledby="stepTitle0">
        <h1 id="stepTitle0" data-i18n="welcome.step0.title"></h1>
        <p class="lede" data-i18n="welcome.step0.body"></p>
        <div class="welcome-hero">
          <img src="../../assets/welcome-illustration.png" alt="" class="welcome-hero-img">
        </div>
      </section>

      <section class="step" data-step="1" aria-labelledby="stepTitle1">
        <div class="icon" aria-hidden="true">📞</div>
        <h1 id="stepTitle1" data-i18n="welcome.step1.title"></h1>
        <ol class="how-list">
          <li data-i18n="welcome.step1.item1"></li>
          <li data-i18n="welcome.step1.item2"></li>
          <li data-i18n="welcome.step1.item3"></li>
        </ol>
        <p class="lede muted" data-i18n="welcome.step1.footer"></p>
      </section>

      <section class="step" data-step="2" aria-labelledby="stepTitle2">
        <div class="icon" aria-hidden="true">🔍</div>
        <h1 id="stepTitle2" data-i18n="welcome.step2.title"></h1>
        <ul class="feature-list">
          <li><span class="feat-icon" aria-hidden="true">🗺️</span><span><b data-i18n="welcome.feat.address"></b><span class="feat-arrow" aria-hidden="true"></span><span data-i18n="welcome.feat.address.desc"></span></span></li>
          <li><span class="feat-icon" aria-hidden="true">📦</span><span><b data-i18n="welcome.feat.tracking"></b><span class="feat-arrow" aria-hidden="true"></span><span data-i18n="welcome.feat.tracking.desc"></span></span></li>
          <li><span class="feat-icon" aria-hidden="true">🔗</span><span><b data-i18n="welcome.feat.link"></b><span class="feat-arrow" aria-hidden="true"></span><span data-i18n="welcome.feat.link.desc"></span></span></li>
          <li><span class="feat-icon" aria-hidden="true">✉️</span><span><b data-i18n="welcome.feat.email"></b><span class="feat-arrow" aria-hidden="true"></span><span data-i18n="welcome.feat.email.desc"></span></span></li>
        </ul>
        <p class="lede muted" data-i18n="welcome.step2.footer"></p>
      </section>

      <section class="step" data-step="3" aria-labelledby="stepTitle3">
        <div class="icon" aria-hidden="true">🕘</div>
        <h1 id="stepTitle3" data-i18n="welcome.step3.title"></h1>
        <p class="lede" data-i18n="welcome.step3.body"></p>
        <p class="lede key-line" data-i18n-shortcut="welcome.step3.open" data-shortcut="history"></p>
        <p class="lede muted" id="winvHint" data-i18n="welcome.step3.winv"></p>
        <p class="lede muted" data-i18n="welcome.step3.privacy"></p>
      </section>

      <section class="step" data-step="4" aria-labelledby="stepTitle4">
        <div class="icon" aria-hidden="true">⚙️</div>
        <h1 id="stepTitle4" data-i18n="welcome.step4.title"></h1>
        <p class="lede" data-i18n="welcome.step4.body"></p>
        <p class="lede key-line" data-i18n-shortcut="welcome.step4.manual" data-shortcut="manual"></p>
        <p class="lede muted" data-i18n="welcome.step4.footer"></p>
        <button type="button" id="openSettingsBtn" class="btn secondary inline-btn" data-i18n="welcome.btn.openSettings"></button>
      </section>

    </main>

    <footer class="footer">
      <div class="dots" id="dots"></div>
      <div class="nav-buttons">
        <button type="button" id="skipBtn" class="btn ghost" data-i18n="welcome.btn.skip"></button>
        <button type="button" id="backBtn" class="btn secondary back" disabled data-i18n="welcome.btn.back"></button>
        <button type="button" id="nextBtn" class="btn primary next" data-i18n="welcome.btn.next"></button>
      </div>
      <div class="copyright" translate="no" dir="ltr">© 2024-2026 TapAct</div>
    </footer>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
